<!DOCTYPE html>
<html lang="bg" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NIKOM · Industries — пет визуални концепции</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap&subset=cyrillic" rel="stylesheet" />
<style>
  /* ---------- TOKENS (mirroring NIKOM design system) ---------- */
  :root {
    --yellow-300: #F7D724;
    --yellow-400: #EBC524;
    --accent: #F7D724;
    --accent-strong: #EBC524;
    --accent-ink: #1A1300;

    --ink-950: #0B0D10;
    --ink-900: #111418;
    --ink-800: #181C22;
    --ink-700: #232932;
    --ink-600: #2E3641;
    --ink-500: #3A4250;
    --ink-400: #6B7280;
    --ink-300: #9CA3AF;
    --ink-200: #D1D5DB;

    --paper-50:  #FAF8F2;
    --paper-100: #F4F1E8;
    --paper-200: #ECE8DB;
    --paper-300: #DDD8C7;

    --bg: var(--paper-50);
    --bg-soft: var(--paper-100);
    --bg-elev: #FFFFFF;
    --fg: var(--ink-950);
    --fg-muted: #4B5562;
    --fg-subtle: #7B8593;
    --border: rgba(11,13,16,.10);
    --border-strong: rgba(11,13,16,.18);

    --radius-md: 14px;
    --radius-lg: 22px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 17px;
    line-height: 1.55;
  }

  .container { max-width: 1320px; margin: 0 auto; padding: 0 clamp(20px, 3vw, 40px); }

  /* ---------- PAGE HERO ---------- */
  .page-hero {
    padding: clamp(56px, 8vw, 96px) 0 clamp(40px, 6vw, 64px);
    border-bottom: 1px solid var(--border);
    background:
      linear-gradient(180deg, var(--bg-elev) 0%, var(--bg) 100%);
    position: relative;
  }
  .page-hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 56px 56px;
    opacity: 0.5;
    pointer-events: none;
    mask-image: radial-gradient(ellipse 70% 80% at 50% 0%, #000 30%, transparent 80%);
  }
  .page-hero .container { position: relative; }
  .ph-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--fg-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .ph-eyebrow::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 4px rgba(247,215,36,0.22);
  }
  .ph-h1 {
    font-family: 'Geologica', sans-serif;
    font-weight: 600;
    font-size: clamp(36px, 5vw, 64px);
    line-height: 1.06;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
    max-width: 18ch;
    text-wrap: balance;
  }
  .ph-lead {
    color: var(--fg-muted);
    font-size: clamp(16px, 1.4vw, 19px);
    max-width: 60ch;
    margin: 0 0 36px;
  }
  .ph-nav { display: flex; flex-wrap: wrap; gap: 10px; }
  .ph-nav a {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 16px 9px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    text-decoration: none;
    color: var(--fg);
    font-family: 'Geologica', sans-serif;
    font-weight: 500;
    font-size: 14px;
    background: var(--bg-elev);
    transition: border-color .2s, transform .2s, background .2s;
  }
  .ph-nav a:hover { border-color: var(--fg); transform: translateY(-1px); }
  .ph-nav a span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent-strong);
    background: rgba(247,215,36,0.14);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* ---------- CONCEPT BLOCK ---------- */
  .concept { padding: clamp(56px, 7vw, 88px) 0; border-bottom: 1px solid var(--border); }
  .concept.dark {
    background: var(--ink-950);
    color: #F5F2EB;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .concept.dark .cnum { color: var(--accent); }
  .concept.dark .cpitch { color: rgba(245,242,235,0.78); }
  .concept.dark .cuse { color: rgba(245,242,235,0.62); }
  .concept.dark .cuse span { color: var(--accent); }

  .cwrap { max-width: 1320px; margin: 0 auto; padding: 0 clamp(20px, 3vw, 40px); }

  .chead {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: clamp(24px, 4vw, 60px);
    align-items: end;
    margin-bottom: clamp(32px, 4vw, 48px);
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .concept.dark .chead { border-bottom: 1px solid rgba(255,255,255,.10); }
  @media (max-width: 820px) { .chead { grid-template-columns: 1fr; align-items: start; } }

  .cnum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--fg-muted);
    margin-bottom: 14px;
  }
  .cname {
    font-family: 'Geologica', sans-serif;
    font-weight: 600;
    font-size: clamp(30px, 3.6vw, 50px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .cpitch {
    margin: 0 0 14px;
    color: var(--fg-muted);
    font-size: 17px;
    max-width: 56ch;
  }
  .cuse { margin: 0; font-size: 14px; color: var(--fg-subtle); font-family: 'Geologica', sans-serif; }
  .cuse span { color: var(--accent-strong); font-weight: 600; margin-right: 6px; }

  /* ---------- SECTOR GRID ---------- */
  .ind-grid-v2 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 980px) { .ind-grid-v2 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 580px) { .ind-grid-v2 { grid-template-columns: 1fr; } }

  .tile-v2 {
    display: flex; flex-direction: column;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: border-color .25s, transform .25s, box-shadow .25s;
  }
  .tile-v2:hover {
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: 0 18px 40px -28px rgba(11,13,16,0.35);
  }
  .ind-grid-v2.on-dark .tile-v2 {
    background: var(--ink-900);
    border-color: rgba(255,255,255,.08);
    color: #F5F2EB;
  }
  .ind-grid-v2.on-dark .tile-v2:hover { border-color: rgba(255,255,255,.18); }

  .tile-art {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--bg-soft);
  }
  .ind-grid-v2.on-dark .tile-art { background: var(--ink-800); }
  .tile-art > * { position: absolute; inset: 0; width: 100%; height: 100%; }

  .tile-cap {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px;
    font-family: 'Geologica', sans-serif;
    font-weight: 500;
    font-size: 15.5px;
    gap: 12px;
  }
  .tile-arr { color: var(--accent-strong); font-weight: 700; }
  .ind-grid-v2.on-dark .tile-arr { color: var(--accent); }

  /* ============================================================
     CONCEPT 01 — SOC MISSION CARD
     ============================================================ */
  .soc {
    background: linear-gradient(180deg, var(--ink-800) 0%, var(--ink-900) 100%);
    color: #F5F2EB;
    padding: 16px 18px 14px;
    display: flex; flex-direction: column; gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    position: relative;
  }
  .soc::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 16px 16px;
    pointer-events: none;
  }
  .soc-top { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .soc-code {
    font-family: 'Geologica', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--accent);
    background: rgba(247,215,36,0.10);
    border: 1px solid rgba(247,215,36,0.35);
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }
  .soc-live {
    display: inline-flex; align-items: center; gap: 6px;
    color: #6EE7A6;
    font-size: 10px;
    letter-spacing: 0.14em;
  }
  .soc-live i {
    width: 6px; height: 6px; border-radius: 50%;
    background: #42C77A;
    box-shadow: 0 0 0 0 rgba(66,199,122,0.6);
    animation: socpulse 1.6s ease-out infinite;
  }
  @keyframes socpulse {
    0% { box-shadow: 0 0 0 0 rgba(66,199,122,0.7); }
    100% { box-shadow: 0 0 0 10px rgba(66,199,122,0); }
  }
  .soc-time { margin-left: auto; color: rgba(245,242,235,0.5); }
  .soc-kpi { display: flex; align-items: baseline; gap: 10px; position: relative; z-index: 1; }
  .soc-num {
    font-family: 'Geologica', sans-serif;
    font-weight: 600;
    font-size: 42px;
    line-height: 1;
    color: #fff;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .soc-lbl { color: rgba(245,242,235,0.55); font-size: 10px; letter-spacing: 0.16em; }
  .soc-log { display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 1; }
  .soc-row {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px;
    transition: opacity .4s;
  }
  .soc-dot { width: 5px; height: 5px; background: var(--accent); }
  .soc-row.on .soc-dot { animation: socrowblink 1s ease-out infinite; }
  @keyframes socrowblink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .soc-ev { color: rgba(245,242,235,0.82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .soc-ts { color: rgba(245,242,235,0.4); }
  .soc-bar {
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    position: relative; z-index: 1;
    margin-top: auto;
  }
  .soc-bar div {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: socsweep 3.4s linear infinite;
  }
  @keyframes socsweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

  /* ============================================================
     CONCEPT 02 — BLUEPRINT
     ============================================================ */
  .blue {
    color: var(--ink-700);
    background:
      linear-gradient(180deg, #FFFFFF 0%, #FAF7EE 100%);
    position: relative;
  }
  .blue svg { display: block; }

  /* ============================================================
     CONCEPT 03 — EDITORIAL CODE PLATE
     ============================================================ */
  .code-plate {
    background:
      radial-gradient(circle at 80% 20%, rgba(247,215,36,0.07), transparent 60%),
      #FFFFFF;
    color: var(--ink-900);
    padding: 16px 22px 14px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 8px;
    position: relative;
    overflow: hidden;
    height: 100%;
  }
  .code-plate::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(11,13,16,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(11,13,16,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }
  .code-plate::after {
    /* corner ticks */
    content: "";
    position: absolute; inset: 8px;
    background:
      linear-gradient(var(--ink-900),var(--ink-900)) top left/14px 1px no-repeat,
      linear-gradient(var(--ink-900),var(--ink-900)) top left/1px 14px no-repeat,
      linear-gradient(var(--ink-900),var(--ink-900)) top right/14px 1px no-repeat,
      linear-gradient(var(--ink-900),var(--ink-900)) top right/1px 14px no-repeat,
      linear-gradient(var(--ink-900),var(--ink-900)) bottom left/14px 1px no-repeat,
      linear-gradient(var(--ink-900),var(--ink-900)) bottom left/1px 14px no-repeat,
      linear-gradient(var(--ink-900),var(--ink-900)) bottom right/14px 1px no-repeat,
      linear-gradient(var(--ink-900),var(--ink-900)) bottom right/1px 14px no-repeat;
    opacity: 0.65;
    pointer-events: none;
  }
  .cp-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--fg-muted);
    letter-spacing: 0.08em;
    position: relative; z-index: 1;
  }
  .cp-spec { color: var(--ink-900); }
  .cp-mark {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    position: relative; z-index: 1;
    padding-left: 4px;
  }
  .cp-code {
    font-family: 'Geologica', sans-serif;
    font-weight: 700;
    font-size: clamp(60px, 8vw, 96px);
    line-height: 0.9;
    color: var(--ink-900);
    letter-spacing: -0.04em;
    font-feature-settings: 'ss01';
  }
  .cp-bars {
    display: flex; align-items: flex-end; gap: 3px;
    height: 60px;
  }
  .cp-bar {
    width: 5px;
    background: var(--accent);
    border-radius: 1px;
    animation: cpbar 2.4s ease-in-out infinite;
    transform-origin: bottom;
  }
  .cp-bar:nth-child(1) { height: 30%; }
  .cp-bar:nth-child(2) { height: 65%; }
  .cp-bar:nth-child(3) { height: 45%; }
  .cp-bar:nth-child(4) { height: 80%; }
  .cp-bar:nth-child(5) { height: 55%; }
  .cp-bar:nth-child(6) { height: 90%; }
  .cp-bar:nth-child(7) { height: 40%; }
  .cp-bar:nth-child(8) { height: 70%; }
  @keyframes cpbar {
    0%, 100% { transform: scaleY(0.6); opacity: 0.55; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  .cp-foot {
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 1;
    padding-top: 8px;
    border-top: 1px solid var(--border-strong);
  }
  .cp-kpi {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-muted);
    letter-spacing: 0.08em;
  }
  .cp-kpi b {
    font-family: 'Geologica', sans-serif;
    font-weight: 700;
    color: var(--ink-900);
    font-size: 17px;
    margin-right: 6px;
    letter-spacing: -0.01em;
  }
  .cp-scan {
    flex: 1;
    height: 1px;
    margin-left: 14px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 40% 100%;
    background-repeat: no-repeat;
    animation: cpscan 3s linear infinite;
  }
  @keyframes cpscan {
    0% { background-position: -40% 0; }
    100% { background-position: 140% 0; }
  }

  /* ============================================================
     CONCEPT 04 — SIGNAL TOPOLOGY
     ============================================================ */
  .topo {
    color: var(--ink-700);
    background:
      radial-gradient(circle at 50% 50%, #FFFFFF 0%, #F4F1E8 100%);
  }
  .topo svg { display: block; }

  /* ============================================================
     CONCEPT 05 — ACTIVITY HEATMAP
     ============================================================ */
  .heat {
    color: var(--ink-700);
    background: #FFFFFF;
  }
  .heat svg { display: block; }

  /* ---------- FOOTER ---------- */
  .page-foot {
    background: var(--ink-950);
    color: rgba(245,242,235,0.7);
    padding: 40px 0;
    font-size: 14px;
    text-align: center;
  }
  .page-foot .container { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="industry-concepts-v2.jsx"></script>
</body>
</html>
