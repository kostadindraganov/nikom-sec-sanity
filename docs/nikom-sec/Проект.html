<!DOCTYPE html>
<html lang="bg" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Проект — NIKOM Security</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap&subset=cyrillic" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="sections.css" />
<link rel="stylesheet" href="animations.css" />
<link rel="stylesheet" href="about.css" />
<link rel="stylesheet" href="projects.css" />
<link rel="stylesheet" href="project-single.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="animations.jsx"></script>
  <script type="text/babel" src="hero.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="projects.jsx"></script>
  <script type="text/babel" src="project-single.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{ "accent": "#F7D724" }/*EDITMODE-END*/;
    function applyAccent(hex) {
      const root = document.documentElement;
      root.style.setProperty('--accent', hex);
      root.style.setProperty('--accent-strong', `color-mix(in oklab, ${hex} 88%, #000)`);
      const c = hex.replace('#',''); const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
      const lum = (0.2126*r + 0.7152*g + 0.0722*b)/255;
      root.style.setProperty('--accent-ink', lum > 0.6 ? '#1A1300' : '#FFFFFF');
    }
    function App() {
      const [theme, setTheme] = useState('light');
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [tweaks] = (window.useTweaks ? window.useTweaks(TWEAK_DEFAULTS) : [TWEAK_DEFAULTS, ()=>{}]);

      // Get project ID from URL ?id=...
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id') || 'tokuda';
      const project = window.getProjectById(projectId);

      // update document title
      useEffect(() => { if (project) document.title = project.title + ' — NIKOM Security'; }, [project]);

      useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
      useEffect(() => { applyAccent(tweaks.accent); }, [tweaks.accent]);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 12);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      if (!project) {
        return <div style={{padding: 80, textAlign: 'center'}}>Проектът не е намерен. <a href="Проекти.html">Назад към проектите</a></div>;
      }

      return (
        <>
          <NIKOMHeader active="Проекти" theme={theme} scrolled={scrolled}
            onToggleTheme={() => setTheme(theme==='light'?'dark':'light')}
            onOpenMenu={() => setMenuOpen(!menuOpen)}/>
          <NIKOMMobileMenu open={menuOpen} onClose={() => setMenuOpen(false)} theme={theme}/>
          <main>
            <ProjectHero p={project} />
            <ProjectFacts p={project} />
            <ProjectScope p={project} />
            <ProjectQuote p={project} />
            <ProjectGallery p={project} />
            <ProjectRelated p={project} />
            <ProjectCta />
          </main>
          <NIKOMFooter />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
